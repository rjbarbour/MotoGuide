plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.digitalmercenaries.ridehorizon'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

repositories {
    mavenCentral()
}

def generatedOutputTool = rootProject.projectDir.parentFile.toPath().resolve('tools/generated-output').toFile()
if (generatedOutputTool.canExecute()) {
    providers.exec {
        workingDir rootProject.projectDir.parentFile
        commandLine generatedOutputTool.absolutePath, 'mark-dependency', 'fact-proxy/.gradle'
    }.standardOutput.asText.get()
}

def acceptedOpenApiContract = providers.gradleProperty('openApiContract')
        .map { rootProject.file(it).absolutePath }
        .orElse(rootProject.projectDir.parentFile.toPath().resolve('FACT_PROXY_OPENAPI.yaml').toString())
def sharedContractFixtures = rootProject.projectDir.parentFile.toPath()
        .resolve('fixtures/contracts/app-proxy/v1')
        .toString()

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.swagger.parser.v3:swagger-parser:2.1.46'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'ridehorizon.openapi.contract', acceptedOpenApiContract.get()
    inputs.file(acceptedOpenApiContract)
            .withPropertyName('openApiContract')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'ridehorizon.contract.fixtures', sharedContractFixtures
    inputs.dir(sharedContractFixtures)
            .withPropertyName('sharedContractFixtures')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'spring.datasource.url', 'jdbc:h2:mem:ridehorizon-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE'
    systemProperty 'spring.datasource.username', 'sa'
    systemProperty 'spring.datasource.password', ''
    systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
}

tasks.register('openApiContractTest', Test) {
    description = 'Validates the complete app-proxy OpenAPI contract and drift fixture.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'ai.digitalmercenaries.ridehorizon.factproxy.OpenApiContractTest'
    }
}

tasks.register('sharedContractFixtureTest', Test) {
    description = 'Verifies the Java contract models against the shared app-proxy fixtures.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'ai.digitalmercenaries.ridehorizon.factproxy.SharedContractFixtureTest'
    }
}

tasks.named('bootJar') {
    archiveFileName = 'fact-proxy.jar'
}

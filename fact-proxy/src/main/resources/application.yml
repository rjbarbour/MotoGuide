server:
  port: ${PORT:3000}

ridehorizon:
  proxy-token: ${RIDEHORIZON_PROXY_TOKEN:}
  admin-token: ${RIDEHORIZON_ADMIN_TOKEN:}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:30}
  diagnostics-enabled: ${RIDEHORIZON_DIAGNOSTICS_ENABLED:false}
  prompt-overrides-enabled: ${RIDEHORIZON_PROMPT_OVERRIDES_ENABLED:false}
  prompt-overrides-object-url: ${RIDEHORIZON_PROMPT_OVERRIDES_OBJECT_URL:}
  prompt-overrides-refresh-seconds: ${RIDEHORIZON_PROMPT_OVERRIDES_REFRESH_SECONDS:60}
  prompt-overrides-auth-token: ${RIDEHORIZON_PROMPT_OVERRIDES_AUTH_TOKEN:}
  short-fact-prompt: ${RIDEHORIZON_SHORT_FACT_PROMPT:}
  long-fact-prompt: ${RIDEHORIZON_LONG_FACT_PROMPT:}
  eleven-labs-api-key: ${ELEVENLABS_API_KEY:}
  eleven-labs-voice-id: ${ELEVENLABS_VOICE_ID:JBFqnCBsd6RMkjVDRZzb}
  eleven-labs-model-id: ${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
  eleven-labs-output-format: ${ELEVENLABS_OUTPUT_FORMAT:mp3_44100_128}
  invite-ttl-hours: ${RIDEHORIZON_INVITE_TTL_HOURS:72}
  credential-ttl-days: ${RIDEHORIZON_CREDENTIAL_TTL_DAYS:90}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  endpoint: https://api.openai.com/v1/chat/completions

spring:
  application:
    name: ridehorizon-fact-proxy
  jackson:
    deserialization:
      fail-on-unknown-properties: true

name: Deploy RideHorizon fact proxy

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ridehorizon-fact-proxy-production
  cancel-in-progress: false

env:
  # The stable RideHorizon edge currently forwards to this existing Fly app.
  # Change the repository variable only when the Cloudflare origin is cut over.
  FLY_APP_NAME: ${{ vars.FLY_APP_NAME || 'motoguide-fact-proxy' }}

jobs:
  deploy:
    name: Deploy after tests
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require Fly deploy credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: test -n "$FLY_API_TOKEN"

      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy tested service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: fact-proxy
        # Build on the GitHub runner. Fly's remote Depot builders currently receive
        # Maven Central 403 responses while resolving the Gradle toolchain plugin.
        run: '"$HOME/.fly/bin/flyctl" deploy --local-only --app "$FLY_APP_NAME" --config fly.toml'

      - name: Smoke-check health endpoint
        run: 'curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 "https://ridehorizon.digitalmercenaries.ai/health"'
